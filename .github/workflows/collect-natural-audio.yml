name: Collect verified natural exam MP3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-natural-audio.yml'
      - 'NATURAL_AUDIO_SOURCES.json'
      - 'scripts/collect_natural_audio.py'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and validate local natural speech files
        run: python scripts/collect_natural_audio.py
      - name: Commit real audio bytes to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-natural/
          if ! git diff --cached --quiet; then
            git commit -m "Archive natural listening MP3 for offline My Exams"
            git push origin HEAD:main
          fi
