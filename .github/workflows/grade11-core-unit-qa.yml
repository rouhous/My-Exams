name: Grade 11 Core Those Teenage Things full nine-section paper QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'grade11/core/units/**'
      - 'scripts/audit_grade11_core_unit2.py'
      - 'tests/grade11_core_unit_browser.cjs'
      - '.github/workflows/grade11-core-unit-qa.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all nine section formats and MP3 script hashes
        run: python3 scripts/audit_grade11_core_unit2.py
      - name: Test full exam and independent skills in mobile Chromium
        run: |
          npm install --no-save playwright@1.56.1
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/grade12-core-server.log 2>&1 &
          sleep 3
          node tests/grade11_core_unit_browser.cjs
