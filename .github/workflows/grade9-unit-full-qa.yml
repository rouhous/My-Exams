name: Verify original Grade 9 full unit exams audio and illustrations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'grade9/unit-exams/**'
      - 'scripts/audit_grade9_unit_full.py'
      - 'tests/grade9_unit_full_browser.cjs'
      - '.github/workflows/grade9-unit-full-qa.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate audio source checksum and exact images
        run: |
          pip install mutagen
          python3 scripts/audit_grade9_unit_full.py
      - name: Exercise three full papers on mobile Chromium
        run: |
          npm install --no-save playwright@1.56.1
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/g9-unit.log 2>&1 &
          sleep 3
          node tests/grade9_unit_full_browser.cjs
