name: Build missing Grade 12 Core units 3 and 4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_missing_grade12_core_units.py'
      - '.github/workflows/build-grade12-core-remaining.yml'
permissions:
  contents: write
concurrency:
  group: build-grade12-core-remaining
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original units 3 and 4
        run: python scripts/build_missing_grade12_core_units.py
      - name: Verify nine section official-shaped original paper drafts
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('grade12/core/units')
          for n,letter in [(3,'c'),(4,'d')]:
              p=json.loads((root/f'unit{n}-paper-{letter}.json').read_text())
              assert p['marks']==70 and p['durationMinutes']==180
              assert len(p['sections'])==7
              for k,(lo,hi) in {'grm':(60,70),'vcb':(80,90),'rdg2':(350,400),'rdg3':(400,450)}.items():
                  s=p['sections'][k]
                  assert lo<=len(s['passage'].split())<=hi,(n,k)
              assert len(p['sections']['rdg1']['texts'])==7
              assert all(35<=len(t['passage'].split())<=45 for t in p['sections']['rdg1']['texts'])
              assert [len(p['sections'][k]['questions']) for k in ('grm','vcb','rdg1','rdg2','rdg3')]==[5,5,7,8,10]
              assert (root/f'paper-{letter}-preview.html').is_file()
          print('PASS: 2 full nine-section 70-mark original Grade12 Core unit drafts')
          PY
      - name: Commit completed draft papers and previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --mixed origin/main
            git add grade12/core/units/unit3-paper-c.json grade12/core/units/unit4-paper-d.json grade12/core/units/paper-c-preview.html grade12/core/units/paper-d-preview.html
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Complete two Grade 12 Core original nine-section unit papers'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
