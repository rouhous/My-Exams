name: Grade 11 Elective The Mind Unit 2 original paper QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'grade11/elective/units/unit2-*'
      - 'grade11/elective/units/paper-b-preview.html'
      - 'grade11/elective/units/audio/manifest.json'
      - 'scripts/audit_grade11_elective_unit2.py'
      - 'tests/grade11_elective_unit2_browser.cjs'
      - '.github/workflows/grade11-elective-unit2-qa.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original unit texts and source-hashed audio
        run: python3 scripts/audit_grade11_elective_unit2.py
      - name: Test mobile full and isolated skill exams
        run: |
          npm install --no-save playwright@1.56.1
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/elective-u2.log 2>&1 &
          sleep 3
          node tests/grade11_elective_unit2_browser.cjs
