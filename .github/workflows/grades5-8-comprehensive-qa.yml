name: Grades 5–8 comprehensive release QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grades5-8-comprehensive-qa.yml'
      - 'scripts/audit_grades5_8_complete.py'
      - 'grades5-6/audio-natural/**'
      - 'grades5-6/activities.json'
      - 'grades5-6/index.html'
      - 'grades7-8/activities.json'
      - 'grades7-8/index.html'
      - 'shared/learning-feedback.js'
      - 'shared/short-answer-marking.js'
      - 'tests/test_learning_feedback.js'
      - 'tests/test_short_answer_marking.js'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test automatic feedback and short-answer marking
        run: node tests/test_learning_feedback.js && node tests/test_short_answer_marking.js
      - name: Install audio duration probe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffprobe -version | head -1
      - name: Verify all Grade 5–8 complete papers, unit answer keys, images and 32 script-matched natural MP3
        run: python scripts/audit_grades5_8_complete.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GRADES5_8_COMPREHENSIVE_TECHNICAL_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified Grades 5–8 comprehensive QA results"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 4
            done
            exit 1
          fi
