name: Grades 5–8 comprehensive release QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grades5-8-comprehensive-qa.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 24 fixed/mixed models and 32 natural MP3
        run: python scripts/audit_grades5_8_complete.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GRADES5_8_COMPREHENSIVE_TECHNICAL_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified Grades 5–8 comprehensive QA results"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 4
            done
            exit 1
          fi
