name: Grade 9 complete exam and media audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grade9-complete-qa.yml'
      - 'scripts/audit_grade9_release.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all models, answers, images, backup audio and sections
        run: python scripts/audit_grade9_release.py
      - name: Save audit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grade9/teacher/GRADE9_RELEASE_QA.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save Grade 9 full-bank quality audit'
            git push origin HEAD:main
          fi
