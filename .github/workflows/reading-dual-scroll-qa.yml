name: Dual-scroll Reading and Grammar/Vocabulary QA
on:
  push:
    branches: [main]
    paths:
      - shared/reading-split.css
      - shared/reading-split.js
      - grades5-6/index.html
      - grades7-8/index.html
      - grade9/index.html
      - grade10/index.html
      - upper-grades-practice.html
      - grade11/**/units/paper-*-preview.html
      - grade12/**/units/paper-*-preview.html
      - tests/test_dual_scroll_reading.py
      - .github/workflows/reading-dual-scroll-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_dual_scroll_reading.py -v
      - run: node --check shared/reading-split.js
