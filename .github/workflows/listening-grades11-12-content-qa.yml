name: Listening content similarity — Grades 11–12 Core/Elective
on:
  pull_request:
    branches: [exam-review-2026-11-16]
    paths:
      - scripts/audit_listening_grades11_12.py
      - .github/workflows/listening-grades11-12-content-qa.yml
  push:
    branches: [fix/listening-two-pass-order-2026-11-16]
    paths:
      - scripts/audit_listening_grades11_12.py
      - .github/workflows/listening-grades11-12-content-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect every listening script; reject verbatim duplicates
        run: |
          python -m py_compile scripts/audit_listening_grades11_12.py
          python scripts/audit_listening_grades11_12.py --fail-exact --output /tmp/g11-g12-listening-similarity.json
      - name: Save cross-grade thematic reuse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-exams-g11-g12-listening-phrase-similarity
          retention-days: 14
          path: /tmp/g11-g12-listening-similarity.json
