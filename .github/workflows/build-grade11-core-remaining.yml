name: Build remaining Grade 11 Core unit papers (1, 3, 4)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_missing_grade11_core_units.py'
      - '.github/workflows/build-grade11-core-remaining.yml'
permissions:
  contents: write
concurrency:
  group: build-grade11-core-remaining
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate all three unit papers and previews
        run: python scripts/build_missing_grade11_core_units.py
      - name: Verify scripts, question formats, boundaries and nine-section marks
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('grade11/core/units')
          for n,l in [(1,'a'),(3,'c'),(4,'d')]:
              p=json.loads((root/f'unit{n}-paper-{l}.json').read_text())
              assert p['marks']==60 and p['durationMinutes']==150
              assert len(p['sections'])==7
              for key,bounds in [('grm',(50,60)),('vcb',(70,80)),('rdg2',(300,350)),('rdg3',(350,400))]:
                  s=p['sections'][key]
                  assert bounds[0]<=len(s['passage'].split())<=bounds[1],(n,key)
              assert len(p['sections']['rdg1']['texts'])==5
              assert all(35<=len(t['passage'].split())<=45 for t in p['sections']['rdg1']['texts'])
              assert (root/f'paper-{l}-preview.html').is_file()
              assert sum(s['marks'] for s in p['sections'].values())==45
              assert [len(p['sections'][k]['questions']) for k in ('grm','vcb','rdg1','rdg2','rdg3')]==[5,5,5,7,8]
          print('PASS three 9-section 60-mark original teacher-review unit drafts')
          PY
      - name: Commit produced original unit drafts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --mixed origin/main
            git add grade11/core/units/unit1-paper-a.json grade11/core/units/unit3-paper-c.json grade11/core/units/unit4-paper-d.json grade11/core/units/paper-a-preview.html grade11/core/units/paper-c-preview.html grade11/core/units/paper-d-preview.html
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Build three original Grade 11 Core SAH nine-section unit papers'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
