name: Upper-grade provisional Listening MP3 — source verified
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_upper_grade_review_audio.py'
      - '.github/workflows/upper-grade-review-audio.yml'
      - 'higher_grades_corrected.json'
permissions:
  contents: write
concurrency:
  group: upper-grade-neural-audio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        track: ['11-elective','12-core','12-elective']
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TTS and validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install edge-tts mutagen
      - name: Generate twelve source-linked draft MP3
        run: python scripts/generate_upper_grade_review_audio.py '${{ matrix.track }}'
      - name: Check SHA-256 passage links and publish
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          from mutagen.mp3 import MP3
          t='${{ matrix.track }}'
          base=pathlib.Path('upper-audio')/t
          man=json.loads((base/'manifest.json').read_text())
          bank=json.loads(pathlib.Path('higher_grades_corrected.json').read_text())[t]
          assert len(man)==12
          for m in bank:
            for p in m['parts']:
              if p['key'] not in ('lst1','lst2'):continue
              e=man[m['id']+'-'+p['key']]
              txt=(p.get('script') or p['passage']).strip()
              assert e['passageSha256']==hashlib.sha256(txt.encode()).hexdigest()
              f=base/e['mp3']
              assert f.is_file() and f.stat().st_size>20000 and MP3(f).info.length>120
          print('PASS 12 source-hashed MP3',t)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5;do
            git fetch origin main
            a=$(sha256sum higher_grades_corrected.json | cut -d' ' -f1)
            b=$(git show origin/main:higher_grades_corrected.json | sha256sum | cut -d' ' -f1)
            if [ "$a" != "$b" ];then echo "Source changed; cannot publish stale recordings" >&2;exit 1;fi
            git reset --mixed origin/main
            git add 'upper-audio/${{ matrix.track }}/'
            if git diff --cached --quiet;then exit 0;fi
            git commit -m "Archive ${{ matrix.track }} source-hashed draft Listening audio"
            if git push origin HEAD:main;then exit 0;fi
            sleep 6
          done
          exit 1
