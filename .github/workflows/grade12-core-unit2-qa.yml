name: Grade 12 Core Starting University original Paper B QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'grade12/core/units/**'
      - 'scripts/audit_grade12_core_unit2.py'
      - 'tests/grade12_core_unit2_browser.cjs'
      - '.github/workflows/grade12-core-unit2-qa.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 70-mark original unit structure and recording when available
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          p=pathlib.Path("grade12/core/units/audio/manifest.json")
          m=json.loads(p.read_text()) if p.exists() else {}
          keys=[f"unit2-listening{n}-original-draft.json" for n in (1,2)]
          if all(k in m for k in keys):
              subprocess.run(["python3","scripts/audit_grade12_core_unit2.py"],check=True)
          else:print("Grade 12 Core Unit 2 MP3 pending; not certified as complete")
          PY
      - name: Run mobile exam only when both recordings exist
        run: |
          npm install --no-save playwright@1.56.1
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/exams12core2.log 2>&1 &
          sleep 3
          python3 - <<'PY'
          import json,pathlib,subprocess
          m=json.loads(pathlib.Path("grade12/core/units/audio/manifest.json").read_text())
          if all(f"unit2-listening{n}-original-draft.json" in m for n in (1,2)):
              subprocess.run(["node","tests/grade12_core_unit2_browser.cjs"],check=True)
          else:print("Grade 12 Core Unit 2 mobile MP3 QA pending")
          PY
