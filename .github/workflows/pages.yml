name: Deploy My Exams current repository
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage latest validated HTML, exams, illustrations and audio
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, shutil, subprocess
          site=pathlib.Path('_site')
          site.mkdir(exist_ok=True)
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          n=0
          for filename in names:
              if not filename: continue
              p=pathlib.PurePosixPath(filename)
              if p.parts[0] in {'.github','.git','_site','scripts','docs'}: continue
              if filename.endswith(('.zip','.csv','.md','.py')): continue
              if not (p.parts[0] in {'grade9','grade10','grades5-6','grades7-8','audio-natural'} or len(p.parts)==1):continue
              src=pathlib.Path(filename)
              if not src.is_file():continue
              dst=site.joinpath(*p.parts)
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,dst)
              n+=1
          for need in ['index.html','sw.js','grade9/index.html','grades5-6/index.html','grades7-8/index.html','grade9/natural_audio.js','grade10/index.html','grade10/data.json']:
              if not (site/need).is_file():raise SystemExit('Missing required page: '+need)
          count=len(list((site/'audio-natural'/'g9'/'a').rglob('*.mp3')))
          if count!=21:raise SystemExit(f'Expected 21 natural Grade 9 MP3, got {count}')
          for f in (site/'audio-natural').rglob('*.mp3'):
              if f.stat().st_size<1024:raise SystemExit('Invalid tiny MP3: '+str(f))
          print(f'Staged {n} current GitHub files including {count} natural MP3; ZIP not used for deployment.')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
