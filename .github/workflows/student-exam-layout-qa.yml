name: Mobile student exam layout and direct entry
on:
  workflow_dispatch:
  push:
    branches: [main, 'qa/student-exam-layout-*']
    paths:
      - 'grade*-skills.html'
      - 'grade*/**'
      - 'grades*/**'
      - 'shared/**'
      - 'tests/student_exam_layout_browser.cjs'
      - '.github/workflows/student-exam-layout-qa.yml'
permissions:
  contents: read
jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the student routes at phone width
        run: |
          npm install --no-save playwright@1.56.1
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/my-exams-layout.log 2>&1 &
          node tests/student_exam_layout_browser.cjs
