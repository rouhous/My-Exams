name: Generate Grade 7 and 8 natural listening MP3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grades7-8-natural-audio.yml'
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech and MP3 validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install edge-tts mutagen
      - name: Generate sixteen original natural recordings
        run: python scripts/generate_grades7_8_audio.py
      - name: Validate every model and commit audio
        run: |
          python - <<'PY'
          from pathlib import Path
          from mutagen.mp3 import MP3
          files=list(Path('grades7-8/assets/audio-natural').glob('*.mp3'))
          assert len(files)==16, f'Expected 16 MP3, got {len(files)}'
          for f in files:assert f.stat().st_size>15000 and MP3(f).info.length>40,f
          print('Validated',len(files),'natural recordings')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grades7-8/assets/audio-natural/
          if ! git diff --cached --quiet; then
            git commit -m "Publish 16 natural Grade 7 and 8 listening recordings"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
