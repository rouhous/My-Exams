name: Build reviewed listening recordings
on:
  push:
    branches: [release/listening-media-2026-11-19]
    paths:
      - scripts/build_reviewed_listening.py
permissions:
  contents: write
jobs:
  recordings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install edge-tts gTTS mutagen
      - run: python scripts/build_reviewed_listening.py
      - name: Commit the verified recordings to the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grades5-6/audio-reviewed grades7-8/assets/audio-reviewed grade9/audio-reviewed grade9/unit-exams/audio/*-two-pass.mp3 grade9/unit-exams/audio/manifest.json listening-release-manifest.json
          git commit -m "Add and verify two-pass recordings for the listening release"
          git push origin HEAD:"$GITHUB_REF_NAME"
