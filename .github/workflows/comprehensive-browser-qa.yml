name: Browser QA Grade 5–8 comprehensive and offline exam
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/comprehensive-browser-qa.yml'
      - 'tests/comprehensive_browser_smoke.cjs'
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use preinstalled Playwright browser
        run: npm install --no-save playwright@1.56.1
      - name: Serve My Exams locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/myexams-serve.log 2>&1 &
          sleep 3
      - name: Test mixed models, listening images, offline audio
        run: node tests/comprehensive_browser_smoke.cjs
