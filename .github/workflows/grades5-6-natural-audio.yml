name: Generate Grade 5 and 6 natural listening MP3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grades5-6-natural-audio.yml'
      - 'scripts/generate_grades5_6_audio.py'
      - 'grades5-6/activities.json'
concurrency:
  group: grades5-6-audio-latest
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech and MP3 tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install edge-tts mutagen
      - name: Generate sixteen natural listening tracks
        run: python scripts/generate_grades5_6_audio.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          from mutagen.mp3 import MP3
          files=list(Path('grades5-6/audio-natural').glob('*.mp3'))
          assert len(files)==16, f'Expected 16 files, found {len(files)}'
          for f in files:assert f.stat().st_size>15000 and MP3(f).info.length>35,f
          import json,hashlib
          tasks=json.load(open('grades5-6/activities.json'))['activities']
          manifest=json.load(open('grades5-6/audio-natural/script_audio_manifest.json'))
          for t in tasks:
            if t['skill']!='listening':continue
            h=hashlib.sha256(json.dumps({'passages':t.get('passages'),'passage':t.get('passage'),'questions':t['questions'],'pictures':t.get('pictureOptions')},sort_keys=True,ensure_ascii=False).encode()).hexdigest()
            assert manifest[t['id']]['sha256_of_script']==h,t['id']
          print('Validated',len(files),'MP3 files')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never upload a recording created from an outdated question bank.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            live_bank=$(git show origin/main:grades5-6/activities.json | sha256sum | cut -d' ' -f1)
            local_bank=$(sha256sum grades5-6/activities.json | cut -d' ' -f1)
            if [ "$live_bank" != "$local_bank" ]; then
              echo "Source questions changed during audio generation; do not publish stale MP3" >&2
              exit 1
            fi
            # Keep only generated audio changes. Never rebase two conflicting binary MP3 commits.
            git reset --mixed origin/main
            git add grades5-6/audio-natural/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish 16 script-matched Grade 5 and 6 listening MP3"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "Cannot publish audio after retries" >&2
          exit 1
