<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#064b34">
<title>مهارات اللغة الإنجليزية | My Exams</title><link rel="stylesheet" href="./shared/oman-theme.css"><link rel="stylesheet" href="./shared/exam-tools.css">
<style>.om-hero{background-image:url("./shared/oman-hero.svg")} .om-skillgrid .om-card{min-height:132px} .om-grade-control{display:flex;gap:8px;flex-wrap:wrap}.om-grade-control button{min-height:43px;padding:7px 14px;border:1px solid #ca9b53;border-radius:10px;background:#fff;color:#075038;font-weight:800;cursor:pointer}.om-grade-control button.active{background:#075038;color:#fff}.om-formpanel .om-helper{display:block;margin:10px 0;color:#516f61;font-size:14px}.om-symbol{font-size:28px}.om-hero p{direction:ltr}</style>
</head><body class="om-shell">
<div class="om-top"><div class="om-brand">📖 My Exams</div><nav class="om-nav"><a href="./exams.html">⌂ الرئيسية</a><a href="./exams.html#grades">🎓 الصفوف</a><a href="./grade12-skills.html">📚 الصف الثاني عشر</a></nav></div>
<header class="om-hero"><div aria-hidden="true" style="font-size:25px;color:#b58c42">✦</div><h1 id="gradeTitle">مهارات اللغة الإنجليزية</h1><p id="enTitle">English Skills</p></header>
<main class="om-content">
<div class="om-breadcrumb"><a href="./exams.html">⌂ بوابة الاختبارات</a><span aria-hidden="true">›</span><span id="crumb">المهارات</span></div>
<div class="om-formpanel">
  <div class="om-formgrid">
  <label for="grade">الصف<select id="grade">
    <option value="5">الخامس · Grade 5</option><option value="6">السادس · Grade 6</option>
    <option value="7">السابع · Grade 7</option><option value="8">الثامن · Grade 8</option>
    <option value="9">التاسع · Grade 9</option><option value="10">العاشر · Grade 10</option>
    <option value="11">الحادي عشر · Grade 11</option><option value="12">الثاني عشر · Grade 12</option>
  </select></label>
  <label for="track" id="trackGroup" hidden>المسار<select id="track"><option value="core">Core · أساسي</option><option value="elective">Elective · اختياري</option></select></label>
  <label for="model">النموذج<select id="model"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select></label>
  </div>
</div>
<section class="om-section"><h2>اختر المهارة</h2><div class="om-skillgrid" id="skills"></div></section>
<section class="om-section"><h2>الاختبارات والأنشطة</h2><div class="om-actions"><a id="exam" class="om-btn gold" href="#">▤ الاختبار الكامل</a><a id="random" class="om-btn outline" href="#">🔀 اختبار عشوائي</a><a id="units" class="om-btn outline" href="#" hidden>☑ اختبارات الوحدات</a></div></section>
</main><footer class="om-footer">© Houssem Rouatbi — جميع الحقوق محفوظة للأستاذ</footer>
<script>
(function(){
const names={5:'الخامس',6:'السادس',7:'السابع',8:'الثامن',9:'التاسع',10:'العاشر',11:'الحادي عشر',12:'الثاني عشر'};
const icon={listening:'🎧',grammar:'📖',vocabulary:'🔠',reading:'📚',writing:'✎',activities:'🧩'};
const data={
5:[['listening1','Listening 1','listening'],['listening2','Listening 2','listening'],['grammar','Grammar','grammar'],['vocabulary','Vocabulary','vocabulary'],['reading1','Reading 1','reading'],['reading2','Reading 2','reading'],['writing1','Writing 1','writing'],['writing2','Writing 2','writing']],
6:[['listening1','Listening 1','listening'],['listening2','Listening 2','listening'],['grammar','Grammar','grammar'],['vocabulary','Vocabulary','vocabulary'],['reading1','Reading 1','reading'],['reading2','Reading 2','reading'],['writing1','Writing 1','writing'],['writing2','Writing 2','writing']],
7:[['listening1','Listening 1','listening'],['listening2','Listening 2','listening'],['grammar','Grammar','grammar'],['vocabulary','Vocabulary','vocabulary'],['reading1','Reading 1','reading'],['writing','Writing','writing']],
8:[['listening1','Listening 1','listening'],['listening2','Listening 2','listening'],['grammar','Grammar','grammar'],['vocabulary','Vocabulary','vocabulary'],['reading1','Reading 1','reading'],['reading2','Reading 2','reading'],['writing','Writing','writing']],
9:[['listening1','Listening 1','listening'],['listening2','Listening 2','listening'],['grammarvocabulary','Grammar & Vocabulary','grammar'],['reading1','Reading 1','reading'],['reading2','Reading 2','reading'],['writing','Writing','writing']],
10:[['listening','Listening','listening'],['grammar','Grammar','grammar'],['vocabulary','Vocabulary','vocabulary'],['reading1','Reading 1','reading'],['reading2','Reading 2','reading'],['writing1','Writing 1','writing'],['writing2','Writing 2','writing']],
11:[['lst1','Listening 1','listening'],['lst2','Listening 2','listening'],['grammar','Grammar','grammar'],['vocabulary','Vocabulary','vocabulary'],['rdg1','Reading 1','reading'],['rdg2','Reading 2','reading'],['rdg3','Reading 3','reading'],['wrt1','Writing 1','writing'],['wrt2','Writing 2','writing']
};
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);
let grade=Number(params.get('grade'))||5;if(grade<5||grade>12)grade=5;
$('grade').value=grade;
const requestedModel=params.get('model');if('ABCDEF'.includes(requestedModel)&&requestedModel?.length===1)$('model').value=requestedModel;
function path(grade,model,skill,track,mode){
if(grade<=6)return './grades5-6/index.html?grade='+grade+'&model='+model+'&'+(skill?'skill='+skill:'mode='+mode);
if(grade<=8)return './grades7-8/index.html?grade='+grade+'&model='+model+'&'+(skill?'mode=practice&skill='+skill:'mode='+mode);
if(grade===9)return './grade9/index.html?model='+model+'&'+(skill?'mode=practice&skill='+skill:'mode='+mode);
if(grade===10)return './grade10/index.html?model='+model+'&'+(skill?'mode=practice&skill='+skill:'mode='+mode);
if(grade===11 && track==='elective')return './upper-grades-practice.html?track=11-elective&model='+model+'&mode='+(skill?'skill':'full')+(skill?'&skill='+skill:'');
const coreKey=skill==='grammar'?'grm':skill==='vocabulary'?'vcb':skill;return './grade11/core/units/paper-a-preview.html'+(coreKey?'?mode=skill&skill='+coreKey:'');
}
function update(){
const grade=Number($('grade').value),model=$('model').value,track=$('track').value;
if(grade===12){location.href='./grade12-skills.html?track=12-'+track+'&model='+model;return}
$('trackGroup').hidden=grade!==11;
$('gradeTitle').textContent='مهارات الصف '+names[grade];
$('enTitle').textContent='Grade '+grade+' English Skills';
$('crumb').textContent='الصف '+names[grade];
document.title='مهارات الصف '+names[grade]+' | My Exams';
const root=$('skills');root.textContent='';
for(const [id,title,family] of data[grade]){
if(grade===11&&track==='elective'&&['grammar','vocabulary','rdg3'].includes(id))continue;
const link=document.createElement('a');link.className='om-card';link.href=path(grade,model,id,track,'practice');link.setAttribute('aria-label','بدء '+title);
const symbol=document.createElement('span');symbol.className='om-symbol';symbol.setAttribute('aria-hidden','true');symbol.textContent=icon[family]||'📚';
const name=document.createElement('strong');name.textContent=title;
const sub=document.createElement('small');sub.textContent='افتح النشاط';link.append(symbol,name,sub);root.append(link)}
$('exam').href=path(grade,model,null,track,'exam');
$('random').href=grade===11&&track==='core'?'./grade11/core/units/paper-a-preview.html':path(grade,model,null,track,'random');
$('random').textContent=grade===11&&track==='core'?'▤ اختبار الوحدة':'🔀 اختبار عشوائي';
$('units').hidden=grade!==9&&grade!==11;
$('units').href=grade===9?'./grade9/unit-exams/index.html':'./grade11/core/units/paper-a-preview.html';
}
for(const id of ['grade','track','model'])$(id).addEventListener('change',update);update();
})();
</script><script defer src="./shared/exam-tools.js"></script></body></html>
