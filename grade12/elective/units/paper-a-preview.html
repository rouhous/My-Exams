/* English short answer marking for My Exams.
   Accept the expected answer as a complete contiguous phrase, with up to four
   words above the question's stated maximum. This checks text, not meaning. */
(function(g){
"use strict";
function words(value){
 return String(value==null?"":value)
 .normalize("NFKC").toLowerCase().replace(/[’‘]/g,"'")
 .replace(/\b(\d+)\s*[-–]\s*(\d+)\b/g,"$1 $2")
 .replace(/[^\p{L}\p{N}]+/gu," ").trim().split(/\s+/).filter(Boolean);
}
function evaluate(value,question){
 const typed=words(value),limit=Number(question&&question.maxWords);
 const maxWords=Number.isFinite(limit)&&limit>0?Math.floor(limit):4;
 const permitted=maxWords+4;
 const variants=[...(Array.isArray(question&&question.answers)?question.answers:[]),question&&question.answer]
   .filter(x=>typeof x==="string"&&x.trim()).flatMap(x=>x.split(/\s+(?:\/|\bor\b)\s+/i));
 const reference=variants.length?variants[0]:"";
 if(!typed.length)return {correct:false,reason:"empty",wordCount:0,maxWords,permitted,reference};
 if(typed.length>permitted)return {correct:false,reason:"too-long",wordCount:typed.length,maxWords,permitted,reference};
 for(const v of variants){
  const target=words(v);
  if(!target.length)continue;
  for(let i=0;i<=typed.length-target.length;i++){
   if(target.every((word,j)=>typed[i+j]===word)){
    return {correct:true,reason:"matched",wordCount:typed.length,maxWords,permitted,reference};
   }
  }
 }
 return {correct:false,reason:variants.length?"no-match":"manual",wordCount:typed.length,maxWords,permitted,reference};
}
g.MyExamsShortAnswers={evaluate,words};
})(window);

</script><script src="../../../shared/data-charts.js?v=1"></script><script src="../../../shared/learning-feedback.js?v=7"></script><link rel="stylesheet" href="../../../shared/assessment-theme.css?v=28"><link rel="stylesheet" href="../../../shared/reading-split.css?v=3"><link rel="stylesheet" href="../../../shared/exam-pages.css?v=1"><script defer src="../../../shared/reading-split.js?v=3"></script><script defer src="../../../shared/exam-pages.js?v=1" data-host="sections" data-reset="back"></script><script defer src="../../../shared/journey-results.js"></script></head><body data-study-tools="compact">

<h1>Grade 12 Elective · Unit 1: The Arts</h1>
<p>Semester 1 · 70 marks · 180-minute full practice · independent skills without a timer</p></header>
<main>
<section class="card controls" id="setup">
<div class="grid"><label>Activity mode<select id="mode"><option value="full">Complete unit paper · 180-minute timer</option><option value="skill">One independent skill · no timer</option></select></label>
<label id="skillWrap" hidden>Choose skill<select id="skill">
<option value="lst1">Listening 1 · Dialogue</option><option value="lst2">Listening 2 · Notes and short answers</option>
<option value="rdg1">Reading 1 · Interactive emails</option><option value="rdg2">Reading 2 · Narrative</option>
<option value="wrt1">Writing 1 · Evaluate</option><option value="wrt2">Writing 2 · Describe chart</option>
</select></label></div>
<p class="meta" id="loadState">Loading six original activities…</p>
<button id="start" disabled>Start activity</button>
</section>
<div id="paper"><section class="card">
<div class="row" style="justify-content:space-between"><div><h2 id="paperTitle">Unit exam</h2><p class="meta" id="paperMarks"></p></div><div id="clock" aria-live="polite"></div></div></section>
<div id="sections"></div>
<section class="card actions"><div class="row"><button id="finish">Finish and review</button><button id="print" class="secondary" type="button">Print</button><button id="restart" class="secondary" type="button">New activity</button></div></section>
<section class="card" id="results" aria-live="polite"></section>
</div></main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const params=new URLSearchParams(location.search);
const mixed=params.get('mixed')==='1';
const unitNumber=Number(params.get('unit'))||1;
const unitNames={1:'The arts',2:'Doing the right thing',3:'Living in a Changing World',4:'Higher Education'};
if(!unitNames[unitNumber])throw Error('Unsupported unit number');
document.title=mixed?'Grade 12 Elective · Comprehensive Mixed Units':'Grade 12 Elective · Unit '+unitNumber+' · '+unitNames[unitNumber]+'';
document.querySelector('header h1').textContent=mixed?'Grade 12 Elective · Comprehensive random unit exam':'Grade 12 Elective · Unit '+unitNumber+': '+unitNames[unitNumber];
const order=['lst1','lst2','rdg1','rdg2','wrt1','wrt2'];
const requestedMode=params.get('mode'),requestedSkill=params.get('skill');
if(requestedMode==='skill' && order.includes(requestedSkill)){
 $('mode').value='skill';
 $('skillWrap').hidden=false;
 $('skill').value=requestedSkill;
}

const name={lst1:'Listening 1',lst2:'Listening 2',rdg1:'Reading 1',rdg2:'Reading 2',wrt1:'Writing 1',wrt2:'Writing 2'};
const files=(mixed?[1,2,3,4]:[unitNumber]).flatMap(n=>['listening1','listening2','reading1','reading2','writing'].map(k=>'unit'+n+'-'+k+'-original-draft.json'));
let audioFiles={},sourceByKey={},tasks={},questions=[],onPaper=false,submitted=false,clockId=null,clockLength=0,clockStarted=0,selected=[];
$('mode').addEventListener('change',()=>{$('skillWrap').hidden=$('mode').value!=='skill'});
Promise.all([...files.map(async file=>{const r=await fetch(file);if(!r.ok)throw Error(file+' unavailable');return r.json()}),fetch('audio/manifest.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)]).then(async ds=>{
 const manifest=ds.pop(),src={};
 for(let i=0;i<files.length;i++) {
  const data=ds[i],u=mixed?Math.floor(i/5)+1:unitNumber;
  if(data.unit?.number!==u)throw Error('Wrong unit source: '+files[i]);
  if(!src[u])src[u]={};
  src[u][['listening1','listening2','reading1','reading2','writing'][i%5]]=data;
 }
 if(mixed){
  const draw=[1,2,3,4,1,2];
  for(let i=draw.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[draw[i],draw[j]]=[draw[j],draw[i]];}
  order.forEach((key,i)=>{
   const u=draw[i],bank=src[u],map={lst1:'listening1',lst2:'listening2',rdg1:'reading1',rdg2:'reading2'};
   tasks[key]=key.startsWith('wrt')?bank.writing[key==='wrt1'?'writing1':'writing2']:bank[map[key]];
   sourceByKey[key]=u;
  });
 }else{
  const {listening1, listening2,reading1,reading2,writing}=src[unitNumber];
  tasks={lst1:listening1,lst2:listening2,rdg1:reading1,rdg2:reading2,wrt1:writing.writing1,wrt2:writing.writing2};
  order.forEach(key=>sourceByKey[key]=unitNumber);
 }
 const hashScript=async text=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)))).map(b=>b.toString(16).padStart(2,'0')).join('');
 if(manifest&&crypto.subtle)for(const [key,n] of [['lst1',1],['lst2',2]]){
  const u=sourceByKey[key],entry=manifest['unit'+u+'-listening'+n+'-original-draft.json'];
  if(entry&&/^[a-z0-9-]+\.mp3$/.test(entry.mp3)&&entry.scriptSha256===await hashScript(tasks[key].script))audioFiles[key]=entry.mp3;
 }
 const expected={lst1:[10,10],lst2:[10,10],rdg1:[12,12],rdg2:[13,13],wrt1:[0,15],wrt2:[0,10]};
 order.forEach(key=>{
  const d=tasks[key],exp=expected[key];
  if(Number(d.marks)!==exp[1]||((d.questions||[]).length!==exp[0]))throw Error('Incorrect part '+key);
  if(d.passage&&d.wordCount!==d.passage.trim().split(/\s+/).length)throw Error('Incorrect word count '+key);
 });
 $('loadState').textContent='Six sections loaded from '+(mixed?'all 4 semester units':'Unit '+unitNumber)+'. 20 Listening + 25 Reading + 25 Writing = 70 marks. Source-matched MP3s: '+Object.keys(audioFiles).length+'/2. Missing audio uses teacher script.';
 $('start').disabled=false;
 if(params.get('open')==='1'&&(requestedMode==='full'||requestedMode==='skill'&&order.includes(requestedSkill)))begin();
}).catch(e=>{$('loadState').textContent='Unable to load activities: '+e.message});
function chart(c){return window.MyExamsCharts.render(c);}
function render(key){
 const d=tasks[key],isListening=key.startsWith('lst'),isWriting=key.startsWith('wrt');
 let h='<section class="part"'+(key.startsWith('rdg')?' data-reading':'')+'><h2>'+esc(name[key])+' · '+d.marks+' marks</h2><p class="meta">Source unit '+sourceByKey[key]+': '+esc(unitNames[sourceByKey[key]])+'</p>';
 if(isListening){
  h+='<p class="meta">'+(audioFiles[key]?'Source-matched MP3 confirmed (played twice).':'Teacher read-aloud required. No validated recording yet.')+'</p>'+
  (audioFiles[key]?'<audio controls preload="metadata" src="audio/'+esc(audioFiles[key])+'"></audio>':'')+
  '<details class="teacher"><summary>Teacher-only script (open for supervised reading)</summary><div class="script">'+esc(d.script)+'</div></details>';
 } else if(d.passage)h+='<div class="passage">'+esc(d.passage)+'</div>';
 if(isWriting){
  h+='<p><strong>'+esc(d.prompt)+'</strong></p>';
  if(d.chart)h+=chart(d.chart);
  h+='<label>Written response<textarea name="'+key+'" placeholder="Write at least '+d.minWords+' words."></textarea></label>';
 }else d.questions.forEach((q,i)=>{
  const id=questions.length;questions.push({key,q,index:id});
  h+='<div class="question"><strong>'+(i+1)+'. '+esc(q.stem)+'</strong>';
  if(Array.isArray(q.options))
    h+=q.options.map((option,j)=>'<label class="option"><input type="radio" name="answer'+id+'" value="'+j+'"> '+esc(option)+'</label>').join('');
  else h+='<input type="text" name="answer'+id+'" placeholder="'+(q.maxWords?'Maximum '+q.maxWords+' words':'Short answer')+'" maxlength="150">';
  h+='</div>';
 });
 return h+'</section>';
}
function begin(){
 if(!tasks.lst1||onPaper)return;
 selected=$('mode').value==='full'?order.slice():[$('skill').value];
 questions=[];submitted=false;
 $('sections').innerHTML=selected.map(render).join('');
 const total=selected.reduce((n,k)=>n+tasks[k].marks,0);
 $('paperTitle').textContent=selected.length===6?(mixed?'Comprehensive randomized unit paper':'Unit '+unitNumber+' complete paper A'):name[selected[0]]+' · independent practice';
 $('paperMarks').textContent=total+' marks in this activity · not certified · teacher script required for Listening';
 $('setup').hidden=true;$('paper').className='active';$('results').style.display='none';$('finish').disabled=false;
 $('start').disabled=true; $('mode').disabled=true;$('skill').disabled=true;onPaper=true;
 clockLength=$('mode').value==='full'?180*60:0;clockStarted=Date.now();
 clearInterval(clockId);
 if(clockLength){tick();clockId=setInterval(tick,1000)}else $('clock').textContent='Untimed';
 $('paper').scrollIntoView({behavior:'smooth'});
}
function tick(){
 if(submitted)return;
 const left=Math.max(0,clockLength-Math.floor((Date.now()-clockStarted)/1000));
 $('clock').textContent='Time left '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
 if(!left){clearInterval(clockId);finish(true)}
}
function finish(expired){
 if(submitted)return;submitted=true;clearInterval(clockId);$('finish').disabled=true;
 let scored=0,correct=0,manual=0,blank=0,review=[];
 questions.forEach(({key,q,index})=>{
  const picked=document.querySelector('input[name="answer'+index+'"]:checked');
  const input=picked||document.querySelector('input[type=text][name="answer'+index+'"]');
  const answer=input?(input.value||'').trim():'';
  if(!answer)blank++;
  if(Array.isArray(q.options)&&Number.isInteger(q.answer)){
   scored++;
   const ok=answer!==''&&Number(answer)===q.answer;
   if(ok)correct++;
   review.push('<li>'+(ok?'✓ Correct':'✗ Incorrect')+' — '+esc(name[key])+' Q'+(index+1)+(ok?'':': '+esc(q.options[q.answer]))+'</li>');
  }else if(typeof q.answer==='string'||Array.isArray(q.answers)){
   const result=window.MyExamsShortAnswers.evaluate(answer,q);scored++;
   if(result.correct)correct++;
   const reason=result.reason==='too-long'?' (maximum '+result.permitted+' words)':result.reason==='empty'?' (no answer)':'';
   review.push('<li>'+(result.correct?'✓ Correct':'✗ Incorrect')+' — '+esc(name[key])+' Q'+(index+1)+reason+(result.correct?'':': '+esc(result.reference))+'</li>');
  }else{manual++;review.push('<li>'+esc(name[key])+' Q'+(index+1)+' — Teacher check required</li>')}
  const holder=input?.closest('.question,.q');
  if(holder){
   const passed=Array.isArray(q.options)&&Number.isInteger(q.answer)?answer!==''&&Number(answer)===q.answer:window.MyExamsShortAnswers.evaluate(answer,q).correct;
   const part=tasks[key]||{};
   holder.querySelectorAll('.mex-fb').forEach(el=>el.remove());
   if($('mode').value==='skill'&&window.MyExamsLearning)holder.insertAdjacentHTML('beforeend',window.MyExamsLearning.feedback(q,{skill:key,passage:part.passage,script:part.script||part.transcript},passed));
  }
 });
 const writing=selected.filter(k=>k.startsWith('wrt')).length;
 window.MyExamsJourney?.report({model:'unit-'+unitNumber,skill:selected.length===1?selected[0]:'',earned:correct,possible:scored,writingPending:writing>0});
 const result=$('results');result.style.display='block';
 result.innerHTML='<h2>Practice review'+(expired?' — time expired':'')+'</h2>'+
 '<p><strong>'+correct+' / '+scored+'</strong> automatically checked questions. '+manual+' answers require teacher review. '+writing+' writing task(s) require teacher assessment. '+blank+' unanswered question(s).</p>'+
 '<p>Short answers are accepted when the required answer appears in your response and the word count is no more than four words above the stated limit.</p>'+
 '<details open><summary>Question-by-question feedback</summary><ol>'+review.join('')+'</ol></details>';
 if($('mode').value!=='skill')result.innerHTML='<h2>Result</h2><p>'+correct+' / '+scored+'</p>';
 result.scrollIntoView({behavior:'smooth'});
}
$('start').addEventListener('click',begin);
$('finish').addEventListener('click',()=>finish(false));
$('print').addEventListener('click',()=>window.print());
$('restart').addEventListener('click',()=>{
 clearInterval(clockId);if(mixed){location.reload();return;}onPaper=false;submitted=false;
 $('setup').hidden=false;$('paper').className='';$('start').disabled=false;$('mode').disabled=false;$('skill').disabled=false;
 window.scrollTo({top:0,behavior:'smooth'});
});
})();
</script><script defer src="../../../shared/exam-tools.js?v=2"></script></body></html>
