<style>

/* English short answer marking for My Exams.
   Accept the expected answer as a complete contiguous phrase, with up to four
   words above the question's stated maximum. This checks text, not meaning. */
(function(g){
"use strict";
function words(value){
 return String(value==null?"":value)
 .normalize("NFKC").toLowerCase().replace(/[’‘]/g,"'")
 .replace(/\b(\d+)\s*[-–]\s*(\d+)\b/g,"$1 $2")
 .replace(/[^\p{L}\p{N}]+/gu," ").trim().split(/\s+/).filter(Boolean);
}
function evaluate(value,question){
 const typed=words(value),limit=Number(question&&question.maxWords);
 const maxWords=Number.isFinite(limit)&&limit>0?Math.floor(limit):4;
 const permitted=maxWords+4;
 const variants=[...(Array.isArray(question&&question.answers)?question.answers:[]),question&&question.answer]
   .filter(x=>typeof x==="string"&&x.trim()).flatMap(x=>x.split(/\s+(?:\/|\bor\b)\s+/i));
 const reference=variants.length?variants[0]:"";
 if(!typed.length)return {correct:false,reason:"empty",wordCount:0,maxWords,permitted,reference};
 if(typed.length>permitted)return {correct:false,reason:"too-long",wordCount:typed.length,maxWords,permitted,reference};
 for(const v of variants){
  const target=words(v);
  if(!target.length)continue;
  for(let i=0;i<=typed.length-target.length;i++){
   if(target.every((word,j)=>typed[i+j]===word)){
    return {correct:true,reason:"matched",wordCount:typed.length,maxWords,permitted,reference};
   }
  }
 }
 return {correct:false,reason:variants.length?"no-match":"manual",wordCount:typed.length,maxWords,permitted,reference};
}
g.MyExamsShortAnswers={evaluate,words};
})(window);

</script><script src="../../../shared/learning-feedback.js?v=1"></script><link rel="stylesheet" href="../../../shared/assessment-theme.css?v=28"><link rel="stylesheet" href="../../../shared/reading-split.css?v=3"><link rel="stylesheet" href="../../../shared/exam-pages.css?v=1"><script defer src="../../../shared/reading-split.js?v=3"></script><script defer src="../../../shared/exam-pages.js?v=1" data-host="sections" data-reset="back"></script></head><body data-study-tools="compact">
<header><a href="../../../grade12-skills.html?track=12-core">← اختبارات المسار</a>
<h1>Grade 12 Core · Unit 1: Retail Therapy</h1><p>Original nine-section assessment · 70 marks</p></header>
<main>

<section class="setup" id="setup"><div class="controls"><label>Activity mode<select id="mode"><option value="full">Full paper · 180-minute timer</option><option value="skill">One skill · no timer</option></select></label><label id="skillWrap" hidden>Skill<select id="skill"><option value="lst1">Listening 1 · 7 marks</option><option value="lst2">Listening 2 · 8 marks</option><option value="grm">Grammar · 5 marks</option><option value="vcb">Vocabulary · 5 marks</option><option value="rdg1">Reading 1 · 7 marks</option><option value="rdg2">Reading 2 · 8 marks</option><option value="rdg3">Reading 3 · 10 marks</option><option value="wrt1">Writing 1 · 10 marks</option><option value="wrt2">Writing 2 · 10 marks</option></select></label></div>
<p id="ready">Checking all nine sections and source-matched recordings…</p><button id="start" disabled>Start practice</button></section>
<div id="paper" class="paper"><section><div class="row"><h2 id="paperTitle">Unit 1 assessment</h2><span class="meta" id="paperMarks"></span><span id="clock" class="clock"></span></div><div class="row"><button id="back" type="button">Back to selection</button><button id="end" type="button">Finish and review</button></div></section>
<div id="sections"></div><section id="results" hidden aria-live="polite"></section></div>
</main><script>
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keys=['lst1','lst2','grm','vcb','rdg1','rdg2','rdg3','wrt1','wrt2'];
const names={lst1:'Listening 1',lst2:'Listening 2',grm:'Grammar',vcb:'Vocabulary',rdg1:'Reading 1',rdg2:'Reading 2',rdg3:'Reading 3',wrt1:'Writing 1',wrt2:'Writing 2'};
let data=null,audioManifest={},sections={},selected=[],questions=[],submitted=false,interval=null,seconds=0,loaded=false;
const sum=k=>k.reduce((n,x)=>n+sections[x].marks,0);
$('mode').onchange=()=>$('skillWrap').hidden=$('mode').value!=='skill';
async function digest(s){if(!crypto.subtle)return'';const bytes=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('')}
async function initialize(){
 try{const [r,a,b,m]=await Promise.all([fetch('unit1-paper-a.json'),fetch('unit1-listening1-original-draft.json'),fetch('unit1-listening2-original-draft.json'),fetch('audio/manifest.json',{cache:'no-store'}).catch(()=>null)]);
 if(!r.ok||!a.ok||!b.ok)throw Error('One original section source is missing');
 data=await r.json();const l1=await a.json(),l2=await b.json();audioManifest=m&&m.ok?await m.json():{};
 sections={...data.sections,lst1:l1,lst2:l2};
 if(keys.reduce((n,k)=>n+Number(sections[k]?.marks||0),0)!==70||l1.questions.length!==7||l2.questions.length!==8||data.status.indexOf('teacher_review')===-1)throw Error('Structure not validated');
 for(const k of ['lst1','lst2']){const src=k==='lst1'?'unit1-listening1-original-draft.json':'unit1-listening2-original-draft.json',entry=audioManifest[src];sections[k].verifiedAudio=!!(entry&&entry.scriptSha256===await digest(sections[k].script));sections[k].audioFile=sections[k].verifiedAudio?'audio/'+entry.mp3:null}
 loaded=true;$('ready').textContent='Nine sections available · 70 marks. Source-matched Listening MP3: '+['lst1','lst2'].filter(k=>sections[k].verifiedAudio).length+' / 2. Short answers and writing remain teacher-reviewed.';$('start').disabled=false;
 if(direct.get('open')==='1'&&(direct.get('mode')==='full'||direct.get('mode')==='skill'&&keys.includes(direct.get('skill'))))start();
 }catch(e){$('ready').textContent='Paper unavailable: '+e.message}
}
function render(key){
 const s=sections[key];let h='<section class="part"'+(key.startsWith('rdg')?' data-reading':'')+'><h2>'+names[key]+' · '+s.marks+' marks</h2>';
 if(key.startsWith('lst')){h+='<p class="meta">'+(s.audioFile?'Source-matched MP3 confirmed, read twice.':'No verified recording: use teacher reading twice.')+'</p>';
 if(s.audioFile)h+='<audio controls preload="metadata" src="'+esc(s.audioFile)+'"></audio>';
 if($('mode').value==='skill')h+='<details><summary>Teacher script (supervised practice only)</summary><div class="script">'+esc(s.script)+'</div></details>';
 }
 if(s.passage&&!key.startsWith('lst'))h+='<div class="passage">'+esc(s.passage)+'</div>';
 if(key==='rdg1'){s.texts.forEach((t,i)=>{h+='<p><b>Text '+(i+1)+'</b></p><div class="passage">'+esc(t.passage)+'</div>';h+=question(key,s.questions[i],i)});}
 else if(key.startsWith('wrt')){h+='<p>'+esc(s.prompt)+'</p><textarea id="write-'+key+'" placeholder="Your writing response"></textarea><p class="meta">Minimum '+s.minWords+' words · human marking required</p>';}
 else s.questions.forEach((q,i)=>{h+=question(key,q,i)});
 return h+'</section>';
}
function question(key,q,i){const id=key+'-'+i;questions.push({id,key,q});let h='<div class="q"><strong>'+(i+1)+'. '+esc(q.stem)+'</strong>';
 if(Array.isArray(q.options))h+=q.options.map((opt,j)=>'<label class="choice"><input type="radio" name="'+id+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+esc(opt)+'</label>').join('');
 else h+='<input type="text" name="'+id+'" maxlength="160" placeholder="Short answer (teacher review)">';
 return h+'</div>';
}
function stopTimer(){if(interval){clearInterval(interval);interval=null}}
function updateClock(){const m=Math.floor(seconds/60),ss=seconds%60;$('clock').textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':'+String(ss).padStart(2,'0')}
function start(){if(!loaded)return;stopTimer();submitted=false;questions=[];selected=$('mode').value==='full'?keys.slice():[$('skill').value];
 $('sections').innerHTML=selected.map(render).join('');$('results').hidden=true;$('results').innerHTML='';$('end').disabled=false;
 $('paperTitle').textContent=selected.length===9?'Complete Retail Therapy Exam':'Independent '+names[selected[0]]+' practice';$('paperMarks').textContent=sum(selected)+' marks';
 $('setup').hidden=true;$('paper').classList.add('active');
 if(selected.length===9){seconds=180*60;updateClock();interval=setInterval(()=>{seconds--;updateClock();if(seconds<=0){stopTimer();finish()}},1000);$('clock').hidden=false}else{$('clock').hidden=true}
 window.scrollTo(0,0);
}
function finish(){if(submitted)return;submitted=true;stopTimer();$('end').disabled=true;
 let objective=0,correct=0,manual=0,rows=[];
 for(const {id,key,q} of questions){const checked=document.querySelector('input[name="'+id+'"]:checked');
 if(Array.isArray(q.options)){objective++;if(checked&&Number(checked.value)===q.answer)correct++;else rows.push('<li>'+esc(names[key])+' · '+esc(q.stem)+' — correct: '+esc(q.options[q.answer])+'</li>')}
 else{
 const written=document.querySelector('input[name="'+id+'"]');
 const result=window.MyExamsShortAnswers.evaluate(written?.value||'',q);
 if(result.reason==='manual'){manual++;rows.push('<li>'+esc(names[key])+' · '+esc(q.stem)+' — teacher check required</li>')}
 else{objective++;if(result.correct)correct++;rows.push('<li>'+(result.correct?'✓ Correct':'✗ Incorrect')+' — '+esc(names[key])+' · '+esc(q.stem)+(result.correct?'':'; expected: '+esc(result.reference))+(result.reason==='too-long'?'; maximum '+result.permitted+' words':'')+'</li>')}
 }}
 questions.forEach(({id,key,q})=>{
   const input=document.querySelector('input[name="'+id+'"]:checked')||document.querySelector('input[name="'+id+'"]');
   const box=input?.closest('.q,.question');
   if(!box)return;
   const good=Array.isArray(q.options)?!!input&&input.type==='radio'&&Number(input.value)===q.answer:
      window.MyExamsShortAnswers.evaluate(input?.value||'',q).correct;
   const part=sections[key]||{};
   box.querySelectorAll('.mex-fb').forEach(el=>el.remove());
   if(window.MyExamsLearning)box.insertAdjacentHTML('beforeend',window.MyExamsLearning.feedback(q,{skill:key,passage:part.passage,script:part.script||part.transcript},good));
 });
 const writings=selected.filter(k=>k.startsWith('wrt')).map(k=>{const v=$('write-'+k)?.value||'';return names[k]+': '+(v.trim().match(/\S+/g)||[]).length+' words (minimum '+sections[k].minWords+')'});
 $('results').hidden=false;$('results').innerHTML='<h2>Objective answers: '+correct+' / '+objective+'</h2><p>'+manual+' unmatched answers and '+writings.length+' writing tasks require teacher review. <b>No total 70-mark examination grade is assigned automatically.</b></p>'+(writings.length?'<p>'+writings.map(esc).join(' · ')+'</p>':'')+(rows.length?'<details><summary>Answer key and teacher-review checklist</summary><ol>'+rows.join('')+'</ol></details>':'');
 $('results').scrollIntoView({behavior:'smooth'});
}
const direct = new URLSearchParams(location.search);
if (direct.get('mode') === 'skill' && keys.includes(direct.get('skill'))) {
 $('mode').value = 'skill';
 $('skill').value = direct.get('skill');
 $('mode').onchange();
}
$('start').onclick=start;$('end').onclick=finish;$('back').onclick=()=>{stopTimer();$('paper').classList.remove('active');$('setup').hidden=false;$('end').disabled=false;window.scrollTo(0,0)};initialize();
</script><script defer src="../../../shared/exam-tools.js"></script></body></html>
