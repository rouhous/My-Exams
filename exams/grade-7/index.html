<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exams · الصف 7 · إنجليزي</title><style>*{box-sizing:border-box}body{margin:0;background:#eef5ef;color:#183e2c;font:16px/1.55 system-ui,Tahoma,Arial}header{padding:16px max(14px,calc((100vw - 1100px)/2));background:#124631;color:white}header h1{margin:0;font-size:26px}nav{display:flex;gap:9px;flex-wrap:wrap;padding:10px 14px;max-width:1140px;margin:auto}nav a,a.action{border-radius:9px;padding:8px 12px;text-decoration:none;background:#e1eddf;color:#124631;font-weight:700}nav a.active{background:#b58e40;color:white}main{max-width:1150px;margin:auto;padding:10px 14px}.notice{border:1px solid #ddc897;background:#fff8e8;padding:11px;border-radius:9px;margin:10px 0}iframe{width:100%;height:83vh;min-height:660px;border:1px solid #cbdccc;border-radius:12px;background:white}select,button{padding:10px;font:inherit;border-radius:8px;border:1px solid #b9cbba}button{background:#15533d;color:#fff;cursor:pointer}footer{padding:12px;color:#556d5a;text-align:center}.choices{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}</style></head><body><header><h1>Exams · الصف 7</h1><div>اختباراتي — اللغة الإنجليزية · الفصل الدراسي الأول · 2026–2027</div></header><nav><a href="../index.html">جميع الصفوف</a><a  href="../grade-5/index.html">الصف 5</a><a  href="../grade-6/index.html">الصف 6</a><a class="active" href="../grade-7/index.html">الصف 7</a><a  href="../grade-8/index.html">الصف 8</a><a  href="../grade-9/index.html">الصف 9</a><a  href="../grade-10/index.html">الصف 10</a><a  href="../grade-11/index.html">الصف 11</a><a  href="../grade-12/index.html">الصف 12</a></nav><main><div class="notice">نسخة معاينة تعليمية قبل الاعتماد النهائي. لا تُستخدم لتسجيل درجات رسمية؛ بعض النصوص لا تزال قيد المراجعة التربوية.</div><div class="choices"><button id="open">افتح الاختبار بصفحة كاملة</button></div><iframe id="paper" title="اختبار الصف 7" loading="eager" allow="autoplay"></iframe></main><footer>My Exams · نسخة مراجعة للصف 7</footer><script>const grade=7,frame=document.getElementById('paper');function url(){const course=document.getElementById('course')?.value,unit=document.getElementById('unit')?.value; if(grade===11||grade===12)return '../../grade'+grade+'/'+course+'/units/paper-'+unit+'-preview.html';return '../../grades7-8/index.html?grade=7&locked=1'}function load(){frame.src=url()}frame.onload=()=>{if(grade<9){try{const select=frame.contentDocument?.getElementById('grade');if(select){select.value=String(grade);select.dispatchEvent(new Event('change',{bubbles:true}));select.disabled=true;select.title='هذا الرابط خاص بالصف '+grade}}catch(e){}}};document.querySelectorAll('select').forEach(s=>s.addEventListener('change',load));document.getElementById('open').onclick=()=>window.open(url(),'_blank','noopener');load();</script></body></html>
