</style><link rel="stylesheet" href="../../shared/exam-tools.css"><script src="../../shared/short-answer-marking.js"></script><script>/* English short answer marking for My Exams.
   Accept the expected answer as a complete contiguous phrase, with up to four
   words above the question's stated maximum. This checks text, not meaning. */
(function(g){
"use strict";
function words(value){
 return String(value==null?"":value)
 .normalize("NFKC").toLowerCase().replace(/[’‘]/g,"'")
 .replace(/\b(\d+)\s*[-–]\s*(\d+)\b/g,"$1 $2")
 .replace(/[^\p{L}\p{N}]+/gu," ").trim().split(/\s+/).filter(Boolean);
}
function evaluate(value,question){
 const typed=words(value),limit=Number(question&&question.maxWords);
 const maxWords=Number.isFinite(limit)&&limit>0?Math.floor(limit):4;
 const permitted=maxWords+4;
 const variants=[...(Array.isArray(question&&question.answers)?question.answers:[]),question&&question.answer]
   .filter(x=>typeof x==="string"&&x.trim()).flatMap(x=>x.split(/\s+(?:\/|\bor\b)\s+/i));
 const reference=variants.length?variants[0]:"";
 if(!typed.length)return {correct:false,reason:"empty",wordCount:0,maxWords,permitted,reference};
 if(typed.length>permitted)return {correct:false,reason:"too-long",wordCount:typed.length,maxWords,permitted,reference};
 for(const v of variants){
  const target=words(v);
  if(!target.length)continue;
  for(let i=0;i<=typed.length-target.length;i++){
   if(target.every((word,j)=>typed[i+j]===word)){
    return {correct:true,reason:"matched",wordCount:typed.length,maxWords,permitted,reference};
   }
  }
 }
 return {correct:false,reason:variants.length?"no-match":"manual",wordCount:typed.length,maxWords,permitted,reference};
}
g.MyExamsShortAnswers={evaluate,words};
})(window);

 if(!source)return "";

 if(key&&!/^(true|false|yes|no)$/.test(key)&&tokens.length&&!(tokens.length===1&&tokens[0].length<4)){

  if(matches.length)return matches.sort((a,b)=>a.length-b.length)[0].slice(0,300);
 }
 const stop=new Set(["what","where","when","which","whose","does","did","this","that","they","them","with","have","from","into","about","should","will","would","their","there","your","were","was","does","uses","what","why","how","who","much","many","main","students","student"]);

 if(qwords.length<2)return "";

 }).filter(a=>a.found>=2&&a.ratio>=0.6);
 return candidates.length?candidates.sort((a,b)=>b.ratio-a.ratio||b.found-a.found||a.text.length-b.text.length)[0].text.slice(0,300):"";

function completedGap(q,ctx,expected){
 const match=String(q?.stem||"").match(/\bGap\s*(\d+)\b/i);

function rule(q,expected,ctx){

 if(typeof known==="string"&&known.trim())return known;

 if(/\bdid not\b/i.test(filled))return "Past simple negative: use did not + base verb (e.g., did not remove).";
 if(/\bif\b/i.test(filled)&&/\bwill\b/i.test(filled))return "First conditional: If + present simple, will + base verb for a likely future result.";
 if(/\b(?:was|were)\s+\w+ed\b/i.test(filled))return "Passive voice or past continuous depends on the verb form: past be + past participle describes an action done to the subject.";
 if((opts.includes("was")&&opts.includes("were"))||(opts.includes("is")&&opts.includes("are")))return "Subject–verb agreement: use is/was with a singular subject, and are/were with a plural subject.";
 if(/\byesterday\b/i.test(filled)&&opts.includes("buy")&&opts.includes("bought"))return "Past simple: use ‘bought’ (past of buy) for an action completed yesterday.";

 if(/\bthan\b/.test(s)&&/more\b|er$|ier$|better|worse/i.test(expected))return "Comparatives: use the comparative form with ‘than’ to compare two things (-er, -ier or more + adjective/adverb).";

const GLOSSES={

"private":"خاصّ / سرّي","source":"مصدر","drought":"جفاف","heatwave":"موجة حر",

"solar panel":"لوح شمسي","wind turbine":"توربين رياح","hydropower":"طاقة كهرومائية",
"battery":"بطارية","grid":"شبكة الكهرباء","archaeologist":"عالم آثار",

function explanation(q,ctx={},override){

 if(p.expected)html+='<p><b>Correct answer:</b> '+esc(p.expected)+'</p>';
 if(p.rule)html+='<p><b>Grammar rule:</b> '+esc(p.rule)+'</p>';
 if(p.meaning)html+='<p><b>Word meaning:</b> '+esc(p.meaning)+'</p>';
 if(p.example)html+='<p><b>Example:</b> '+esc(p.example)+'</p>';
 if(p.evidence){
  let quote=esc(p.evidence);
  const pos=p.evidence.toLowerCase().indexOf(p.expected.toLowerCase());
  if(pos>=0&&p.expected){quote=esc(p.evidence.slice(0,pos))+'<mark>'+esc(p.evidence.slice(pos,pos+p.expected.length))+'</mark>'+esc(p.evidence.slice(pos+p.expected.length))}
  html+='<p><b>From the '+esc(p.kind)+':</b></p><blockquote>'+quote+'</blockquote>';
 }
 if(!p.rule&&!p.meaning&&!p.example&&!p.evidence)html+='<p class="mex-fb-note">Compare your response with the reference answer. No verified explanation or source sentence was stored for this item.</p>';

function pageGrade(){
 const url=new URLSearchParams(w.location?.search||"");
 const grade=Number(url.get("grade"));if(grade>=5&&grade<=12)return grade;

}
function genre(prompt){
 const s=String(prompt).toLowerCase();
 if(/\bemail\b|\bletter\b|رسالة|بريد/.test(s))return "email";
 if(/\bstory\b|\bnarrative\b|beginning:|قص[ةص]/.test(s))return "story";
 if(/\bchart\b|\bgraph\b|\bdata\b|\bpercentages?\b|رسم بياني/.test(s))return "description";
 if(/\bopinion\b|\bdiscuss\b|\bevaluate\b|\badvantages?\b|\bdisadvantages?\b/.test(s))return "opinion";
 return "informative";

}

  const [r,m]=await Promise.all([fetch('./models.json'),fetch('./audio/manifest.json',{cache:'no-store'}).catch(()=>null)]);
  if(!r.ok)throw Error('The original paper build has not been published yet');
  bank=await r.json();manifest=m&&m.ok?await m.json():{};
  if(bank.models.length!==3||bank.models.some(x=>x.tasks.length!==7||x.marks!==40))throw Error('Unvalidated paper shape');
  for(const unit of bank.models)for(const task of unit.tasks.slice(0,2)){
    const entry=manifest[task.id],hash=await sha(task.transcript);
    sourceStatus[task.id]=entry&&entry.sourceTranscriptSha256===hash?'audio/'+entry.mp3:null;
  }
  setReady();
  if(direct.get('open')==='1'&&['U1','U2','U3'].includes(unitValue)&&(direct.get('mode')==='full'||direct.get('mode')==='skill'&&/^[0-6]$/.test(direct.get('skill')||'')))start();
 }catch(e){$('ready').textContent='Cannot open original unit exams: '+e.message}
}
function setReady(){if(!bank)return;model=bank.models.find(x=>x.model===$('unit').value);
 const ok=model.tasks.slice(0,2).filter(t=>sourceStatus[t.id]).length;
 $('ready').textContent='Unit '+model.unit+': '+model.unitTitle+' · seven sections, 40 marks · source-verified MP3 '+ok+'/2. Unverified audio is not played.';
 $('start').disabled=false}
function pictureAsset(path){return path.replace(/(\/illustration-(?:extra-)?\d-\d)\.png$/,'$1.webp')}
function question(task,q,index){
 const id=task.id+'-'+index;asked.push({id,q,task});let h='<div class="q"><strong>'+(index+1)+'. '+esc(q.stem)+'</strong>';
 if(q.images){h+='<div class="images">'+q.images.map((src,i)=>'<label class="choice"><b>'+String.fromCharCode(65+i)+'</b><img src="'+esc(pictureAsset(src))+'" alt="Illustration for option '+String.fromCharCode(65+i)+'"><input name="'+id+'" type="radio" value="'+i+'" aria-label="Option '+String.fromCharCode(65+i)+'"></label>').join('')+'</div>';}
 else if(q.choices){h+=q.choices.map((opt,i)=>'<label class="choice"><input name="'+id+'" type="radio" value="'+i+'"> '+String.fromCharCode(65+i)+'. '+esc(opt)+'</label>').join('')}
 else h+='<input type="text" name="'+id+'" maxlength="200" placeholder="Short answer · teacher review">';
 return h+'</div>';
}
function render(task){
 let h='<section class="section"><h2>'+esc(task.title)+' · '+task.marks+' marks</h2>';
 if(task.skill==='listening'){
 const src=sourceStatus[task.id];
 h+='<p class="muted">'+(src?'Verified MP3, script read twice.':'Audio unavailable. For supervised practice, ask your teacher to read the script twice.')+'</p>';
 if(src)h+='<audio controls preload="metadata" src="'+esc(src)+'"></audio>';
 if($('mode').value==='skill')h+='<details><summary>Teacher transcript (supervised revision only)</summary><div class="teacherScript">'+esc(task.transcript)+'</div></details>';
 }
 if(task.passage)h+='<div class="passage">'+esc(task.passage)+'</div>';
 if(task.people)h+='<p><b>Activities</b></p><ol type="A">'+task.options.map(x=>'<li>'+esc(x.replace(/^[A-E]:\s*/,''))+'</li>').join('')+'</ol>';
 if(task.skill==='writing'){h+='<p>'+esc(task.prompt)+'</p><textarea id="write'+task.group+'" placeholder="Write at least '+task.minWords+' words"></textarea><p class="manual">Minimum '+task.minWords+' words · teacher review required</p>';}
 else for(const [i,item] of task.items.entries())h+=question(task,item,i);
 return h+'</section>';
}
function clock(){let m=Math.floor(seconds/60);$('clock').textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function stop(){if(timer){clearInterval(timer);timer=null}}
function start(){if(!model)return;stop();asked=[];finished=false;selected=$('mode').value==='full'?model.tasks:[model.tasks[Number($('skill').value)]];
 $('tasks').innerHTML=selected.map(render).join('');$('paperTitle').textContent='Unit '+model.unit+': '+model.unitTitle;$('marks').textContent=selected.reduce((n,t)=>n+t.marks,0)+' marks';$('results').hidden=true;$('results').innerHTML='';$('end').disabled=false;$('setup').hidden=true;$('paper').classList.add('active');
 if(selected.length===7){seconds=120*60;clock();$('clock').hidden=false;timer=setInterval(()=>{seconds--;clock();if(seconds<=0){stop();finish()}},1000)}else $('clock').hidden=true;window.scrollTo(0,0)}
function finish(){
 if(finished)return;finished=true;stop();$('end').disabled=true;
 let checked=0,correct=0,manual=0,blank=0,rows=[];
 for(const {id,q,task} of asked){
   if(Array.isArray(q.choices)){
     checked++;
     const picked=document.querySelector('input[name="'+id+'"]:checked');
     if(!picked)blank++;
     const ok=!!picked&&Number(picked.value)===q.answer;
     if(ok)correct++;
     rows.push('<li>'+(ok?'✓ Correct':'✗ Incorrect')+' · '+esc(task.title)+' · '+esc(q.stem)+(ok?'':'; expected: '+esc(q.choices[q.answer]))+'</li>');
   }else{
     const field=document.querySelector('input[name="'+id+'"]');
     const value=field?.value?.trim()||'';
     if(!value)blank++;
     const verdict=window.MyExamsShortAnswers.evaluate(value,q);
     if(verdict.reason==='manual'){
       manual++;
       rows.push('<li>Review needed · '+esc(task.title)+' · '+esc(q.stem)+'</li>');
     }else{
       checked++;
       if(verdict.correct)correct++;
       rows.push('<li>'+(verdict.correct?'✓ Correct':'✗ Incorrect')+' · '+esc(task.title)+' · '+esc(q.stem)+(verdict.correct?'':'; expected: '+esc(verdict.reference))+(verdict.reason==='too-long'?'; allowed: '+verdict.permitted+' words':'')+'</li>');
     }
   }
   const field=document.querySelector('input[name="'+id+'"]:checked')||document.querySelector('input[name="'+id+'"]');
   const holder=field?.closest('.question');
   if(holder){
     const choice=Array.isArray(q.choices),val=field?.value||'';
     const good=choice?!!field&&Number(val)===q.answer:window.MyExamsShortAnswers.evaluate(val,q).correct;
     holder.querySelectorAll('.mex-fb').forEach(el=>el.remove());
     if(window.MyExamsLearning)holder.insertAdjacentHTML('beforeend',window.MyExamsLearning.feedback(q,{skill:task.skill,passage:task.passage,script:task.transcript||task.script},good));
   }
 }
 const writing=selected.filter(t=>t.skill==='writing').map(t=>{const v=$('write'+t.group)?.value||'';return t.title+': '+(v.trim().match(/\S+/g)||[]).length+' words'});
 $('results').hidden=false;
 $('results').innerHTML='<h2>Practice review</h2><p><strong>'+correct+' / '+checked+'</strong> automatically checked answers. '+blank+' blank, '+manual+' answer(s) without a stored reference, '+writing.length+' writing task(s) need teacher assessment.</p><p>Short answers are marked correct when the required reference appears in the response, with up to <strong>4 extra words</strong> above the question limit.</p>'+(writing.length?'<p>'+writing.map(esc).join(' · ')+'</p>':'')+'<p>The result excludes writing and is not a final 40-mark grade.</p>'+(rows.length?'<details open><summary>Review every answer</summary><ol>'+rows.join('')+'</ol></details>':'');
 $('results').scrollIntoView({behavior:'smooth'});
}
$('start').onclick=start;$('end').onclick=finish;$('back').onclick=()=>{stop();$('paper').classList.remove('active');$('setup').hidden=false;window.scrollTo(0,0)};
init();
</script><script defer src="../../shared/exam-tools.js"></script></body></html>
